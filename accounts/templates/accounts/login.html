<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Bengkel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#0d6efd,#4f8dfd);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
        }

        .login-card{

            width:100%;
            max-width:430px;

            background:white;

            border-radius:20px;

            padding:35px;

            box-shadow:0 20px 45px rgba(0,0,0,.2);

        }

        .logo{

            width:90px;
            height:90px;

            border-radius:50%;

            background:#0d6efd;

            color:white;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:38px;

            margin:auto;

            margin-bottom:20px;

        }

        h2{

            text-align:center;

            margin-bottom:10px;

            font-weight:bold;

        }

        p{

            text-align:center;

            color:gray;

            margin-bottom:25px;

        }

        label{

            font-weight:600;

        }

        input{

            width:100%;

            padding:10px 15px;

            border:1px solid #ced4da;

            border-radius:10px;

            margin-top:6px;

            margin-bottom:18px;

        }

        input:focus{

            outline:none;

            border-color:#0d6efd;

            box-shadow:0 0 0 .15rem rgba(13,110,253,.25);

        }

        .btn-login{

            width:100%;

            padding:12px;

            border:none;

            border-radius:10px;

            background:#0d6efd;

            color:white;

            font-weight:bold;

            transition:.3s;

        }

        .btn-login:hover{

            background:#0b5ed7;

        }

        .register{

            margin-top:20px;

            text-align:center;

        }

        .register a{

            text-decoration:none;

            font-weight:bold;

        }

        .alert{

            border-radius:10px;

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">

        <i class="fas fa-tools"></i>

    </div>

    <h2>Sistem Bengkel</h2>

    <p>Silakan login untuk melanjutkan</p>

    {% if form.errors %}

    <div class="alert alert-danger">

        Username atau password salah.

    </div>

    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Username</label>

        {{ form.username }}

        <label>Password</label>

        {{ form.password }}

        <button class="btn-login" type="submit">

            <i class="fas fa-sign-in-alt"></i>

            Masuk

        </button>

    </form>

    <div class="register">

        Belum punya akun?

        <a href="{% url 'register' %}">

            Daftar Sekarang

        </a>

    </div>

</div>

</body>

</html>
