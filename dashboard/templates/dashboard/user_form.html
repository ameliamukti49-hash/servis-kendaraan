{% extends 'dashboard/base_dashboard.html' %}


{% block content %}


<div class="container-fluid">


<div class="card shadow border-0">


<div class="card-header bg-primary text-white">

<h5 class="mb-0">
Tambah User
</h5>

</div>



<div class="card-body">


<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label class="form-label">
Username
</label>

<input 
type="text"
name="username"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">
Email
</label>

<input 
type="email"
name="email"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Password
</label>

<input 
type="password"
name="password"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">
Role
</label>


<select 
name="role"
class="form-control"
required>


<option value="admin">
Admin
</option>


<option value="pelanggan">
Pelanggan
</option>


<option value="mekanik">
Mekanik
</option>


<option value="kasir">
Kasir
</option>


<option value="service_advisor">
Service Advisor
</option>


</select>


</div>



<button 
type="submit"
class="btn btn-primary">

Simpan

</button>


<a 
href="{% url 'dashboard:user_list' %}"
class="btn btn-secondary">

Kembali

</a>


</form>


</div>


</div>


</div>


{% endblock %}
