<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel | Servis Kendaraan{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f8f9fa; }
        .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; padding: 55px 0 0; box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1); background-color: #212529; width: 240px; }
        .sidebar .nav-link { font-weight: 500; color: #a3a6b1; padding: 12px 20px; }
        .sidebar .nav-link:hover { color: #fff; background-color: rgba(255, 255, 255, 0.1); }
        .sidebar .nav-link.active { color: #fff; background-color: #0d6efd; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; text-align: center; }
        main { margin-left: 240px; padding-top: 20px; }
        .navbar-brand { padding-top: .75rem; padding-bottom: .75rem; background-color: rgba(0, 0, 0, .25); width: 240px; }
    </style>
</head>
<body>

    <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6" href="{% url 'dashboard:home' %}">
            <i class="fa-solid fa-wrench me-2"></i>Bengkel Admin
        </a>
        <div class="navbar-nav w-100 d-flex flex-row justify-content-end px-3">
            <div class="nav-item text-nowrap text-white align-self-center me-3">
                <i class="fa-solid fa-user-shield me-1"></i> Mode Bypass / Admin
            </div>
            <div class="nav-item text-nowrap">
                <a class="nav-link px-3 btn btn-danger btn-sm text-white" href="/login/">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Keluar
                </a>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'dashboard:home' %}">
                                <i class="fa-solid fa-chart-pie"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if 'user' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:user_list' %}">
                                <i class="fa-solid fa-users-gear"></i> Manajemen User
                            </a>
                        </li>
                        <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase font-monospace" style="font-size: 0.75rem;">
                            <span>Modul Laporan</span>
                        </h6>
                        <li class="nav-item">
                            <a class="nav-link {% if 'booking' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:laporan_booking' %}">
                                <i class="fa-solid fa-calendar-check"></i> Laporan Booking
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if 'servis' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:laporan_servis' %}">
                                <i class="fa-solid fa-screwdriver-wrench"></i> Laporan Servis
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if 'pembayaran' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:laporan_pembayaran' %}">
                                <i class="fa-solid fa-file-invoice-dollar"></i> Laporan Pembayaran
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">{% block page_title %}Dashboard Utama{% endblock %}</h1>
                </div>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
