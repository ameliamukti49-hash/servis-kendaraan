<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Bengkel{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f4f7fc;
            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
        }

        .sidebar{
            position:fixed;
            top:0;
            left:0;
            width:250px;
            height:100vh;
            background:#0d6efd;
            color:white;
            padding-top:20px;
        }

        .sidebar h3{
            text-align:center;
            margin-bottom:30px;
            font-weight:bold;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px 20px;
            transition:.3s;
        }

        .sidebar a:hover{
            background:rgba(255,255,255,.2);
        }

        .content{
            margin-left:250px;
            padding:30px;
        }

        .navbar-custom{
            background:white;
            border-radius:15px;
            padding:15px 25px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
            margin-bottom:30px;
        }

        .card-dashboard{
            border:none;
            border-radius:20px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
            transition:.3s;
        }

        .card-dashboard:hover{
            transform:translateY(-5px);
        }

        .icon{
            font-size:45px;
            color:#0d6efd;
        }
    </style>

</head>

<body>

<div class="sidebar">

    <h3>BENGKEL</h3>

    <a href="{% url 'pelanggan_dashboard' %}">
        <i class="fas fa-home"></i>
        Dashboard
    </a>

    <a href="#">
        <i class="fas fa-user"></i>
        Profil
    </a>

    <a href="#">
        <i class="fas fa-car"></i>
        Kendaraan
    </a>

    <a href="#">
        <i class="fas fa-calendar"></i>
        Booking Servis
    </a>

    <a href="#">
        <i class="fas fa-history"></i>
        Riwayat
    </a>

    <a href="{% url 'logout' %}">
        <i class="fas fa-sign-out-alt"></i>
        Logout
    </a>

</div>

<div class="content">

    <div class="navbar-custom d-flex justify-content-between">

        <h4>Dashboard Pelanggan</h4>

        <div>

            <strong>{{ request.user.first_name }}</strong>

        </div>

    </div>

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
