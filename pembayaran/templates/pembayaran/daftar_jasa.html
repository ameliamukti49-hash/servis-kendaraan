{% extends 'dashboard/base_dashboard.html' %}


{% block content %}


<div class="container-fluid">


<div class="card shadow border-0">


<div class="card-header bg-success text-white">


<a href="{% url 'tambah_jasa' %}"
class="btn btn-light btn-sm float-end">

+ Tambah Jasa

</a>


<h5 class="mb-0">

Data Jasa Servis

</h5>


</div>




<div class="card-body">


<table class="table table-bordered table-hover">


<thead class="table-success">


<tr>

<th>No</th>

<th>Nama Jasa</th>

<th>Biaya</th>

<th>Aksi</th>

</tr>


</thead>




<tbody>


{% for item in jasa %}


<tr>


<td>
{{ forloop.counter }}
</td>



<td>
{{ item.nama }}
</td>



<td>
Rp {{ item.biaya }}
</td>



<td>


<a href="{% url 'edit_jasa' item.id %}"
class="btn btn-warning btn-sm">

Edit

</a>



<a href="{% url 'hapus_jasa' item.id %}"
class="btn btn-danger btn-sm">

Hapus

</a>


</td>


</tr>



{% empty %}


<tr>

<td colspan="4"
class="text-center">

Belum ada data jasa

</td>

</tr>



{% endfor %}


</tbody>


</table>


</div>


</div>


</div>



{% endblock %}
